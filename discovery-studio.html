<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Discovery Content Intelligence · Casa Amar</title><link rel="stylesheet" href="/platform-ui.css?v=20260724.328"><style>
main{max-width:1180px;margin:auto;padding:32px 20px}.hero{margin-bottom:24px}.hero h1{font-size:clamp(2rem,5vw,4rem);margin:.2em 0}.grid{display:grid;gap:14px}.asset{background:#fff;border:1px solid #ded8ce;border-radius:18px;padding:18px}.asset-head{display:flex;justify-content:space-between;gap:15px}.asset h2{margin:0;font-size:1.1rem}.muted{color:#68756f}.chips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.chip{background:#f1eee8;border-radius:999px;padding:5px 9px;font-size:.78rem}.weights{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.weights label{display:grid;gap:4px;font-size:.78rem;font-weight:800}.weights input{padding:9px;border:1px solid #d7d1c7;border-radius:10px}.actions{display:flex;gap:8px;margin-top:12px}.actions button{border:0;border-radius:10px;padding:9px 12px;font-weight:800;cursor:pointer}.primary{background:#20332d;color:#fff}.issue{color:#a43d28;font-weight:800}.ok{color:#17633f;font-weight:800}</style></head><body><main><a href="/control/">← Kontrolcenter</a><section class="hero"><p class="muted">Platform · Discovery Engine</p><h1>Content Intelligence</h1><p>Vedligehold søgeintentioner og relevansvægte uden at ændre gæsteoplevelsen. AI-forslag gemmes kun som kladder og udgives aldrig automatisk.</p></section><div id="summary"></div><section class="grid" id="assets"></section></main>
<script src="/domains/casa-amar/journey-content.js?v=20260724.328"></script><script src="/core/casa-discovery-core.js?v=20260724.328"></script><script src="/domains/casa-amar/discovery-profile.js?v=20260724.328"></script><script src="/core/casa-discovery-content-intelligence.js?v=20260724.328"></script><script>
const svc=window.CasaDiscoveryContentIntelligence,drafts=svc.getDraft(),assets=svc.list();
summary.innerHTML=`<p><strong>${assets.length} assets</strong> · ${assets.filter(a=>a.issues.length).length} kræver opmærksomhed · motor ${window.CasaDiscoveryCore.version}</p>`;
function render(){assetsEl=document.getElementById('assets');assetsEl.innerHTML=assets.map(a=>{const weights={...(a.intentWeights||{}),...(drafts[a.id]?.intentWeights||{})};const keys=[...new Set([...(a.primaryIntents||[]),...Object.keys(weights),...(a.suggestions||[]).map(x=>x.intent)])].slice(0,8);return `<article class="asset"><div class="asset-head"><div><h2>${a.title}</h2><div class="muted">${a.type} · ${a.locationLabel||a.location||'—'}</div></div><span class="${a.issues.length?'issue':'ok'}">${a.issues.length?a.issues.length+' problemer':'Klar'}</span></div><div class="chips">${(a.mealMoments||[]).map(x=>`<span class="chip">${x}</span>`).join('')}${(a.primaryIntents||[]).map(x=>`<span class="chip">${x}</span>`).join('')}</div><div class="weights">${keys.map(k=>`<label>${k}<input type="number" min="0" max="100" value="${weights[k]||''}" data-asset="${a.id}" data-intent="${k}"></label>`).join('')}</div><div class="actions"><button class="primary" data-save="${a.id}">Gem kladde</button>${a.suggestions.length?`<button data-suggest="${a.id}">Anvend AI-forslag (${a.suggestions.length})</button>`:''}</div></article>`}).join('')}
render();document.addEventListener('click',e=>{const save=e.target.closest('[data-save]'),suggest=e.target.closest('[data-suggest]');if(save){const id=save.dataset.save,inputs=[...document.querySelectorAll(`[data-asset="${id}"]`)],intentWeights=Object.fromEntries(inputs.filter(i=>i.value!=='').map(i=>[i.dataset.intent,Number(i.value)]));svc.update(id,{intentWeights});save.textContent='Kladde gemt';}if(suggest){const a=assets.find(x=>x.id===suggest.dataset.suggest);a.suggestions.forEach(x=>{const input=document.querySelector(`[data-asset="${a.id}"][data-intent="${x.intent}"]`);if(input)input.value=x.weight});}});
</script></body></html>
