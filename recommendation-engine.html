<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="casa-amar-build" content="2026-07-28T08:12:42+02:00"><title>AI Recommendations</title><style>body{font-family:system-ui;margin:0;background:#f6f3ed;color:#17372e}.wrap{max-width:1000px;margin:auto;padding:32px}.card{background:white;border:1px solid #ddd4c7;border-radius:18px;padding:20px;margin:14px 0}.actions{display:flex;gap:10px;flex-wrap:wrap}button,a.btn{border:1px solid #cfc4b6;border-radius:999px;padding:10px 14px;background:white;color:#17372e;text-decoration:none;font-weight:700}.muted{color:#68756f}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#edf6f1;font-size:.8rem}</style></head><body><main class="wrap"><a href="/control/#ai-workspace">← AI Workspace</a><h1>AI Recommendations</h1><p class="muted">AI foreslår. Du beslutter. Ingen ændring udføres automatisk.</p><div id="list"></div></main><script src="/core/casa-recommendations.js?v=20260724.134"></script><script>const labels={accept:'Acceptér',pause:'Sæt på pause',reject:'Afvis',review_later:'Gennemgå senere'};CasaRecommendations.list().then(items=>{document.querySelector('#list').innerHTML=items.map(x=>`<article class="card"><span class="pill">${x.status}</span><h2>${x.title}</h2><p><strong>Hvorfor:</strong> ${x.reason}</p><p><strong>Forventet gevinst:</strong> ${x.expected_benefit}</p><p><strong>Confidence:</strong> ${Math.round(x.confidence*100)}%</p><p class="muted">${x.evidence.message}</p><div class="actions">${x.actions.map(a=>`<button data-id="${x.id}" data-action="${a}">${labels[a]}</button>`).join('')}</div></article>`).join('')});document.addEventListener('click',async e=>{const b=e.target.closest('button[data-action]');if(!b)return;await CasaRecommendations.decide(b.dataset.id,b.dataset.action);b.closest('.card').querySelector('.pill').textContent=b.dataset.action;});});</script></body></html>
