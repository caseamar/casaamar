<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="casa-amar-build" content="2026-07-28T08:46:07+02:00"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Recommendations</title><style>body{font-family:system-ui;margin:0;background:#f6f3ed;color:#17372e}.wrap{max-width:1000px;margin:auto;padding:32px}.card{background:white;border:1px solid #ddd4c7;border-radius:18px;padding:20px;margin:14px 0}.actions{display:flex;gap:10px;flex-wrap:wrap}button,a.btn{border:1px solid #cfc4b6;border-radius:999px;padding:10px 14px;background:white;color:#17372e;text-decoration:none;font-weight:700}.muted{color:#68756f}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#edf6f1;font-size:.8rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.fact{background:#fbfaf7;border-radius:12px;padding:12px}.error{background:#fff1ee;border-color:#d99b8d}h1,h2{overflow-wrap:anywhere}</style></head><body><main class="wrap"><a href="/control/#ai-workspace">← AI Workspace</a><h1>AI Recommendations</h1><p class="muted">AI foreslår. Du beslutter. Ingen ændring udføres automatisk.</p><div id="list"><article class="card">Indlæser anbefalinger…</article></div></main><script src="/core/casa-recommendations.js?v=20260724.135"></script><script>const labels={accept:'Acceptér',pause:'Sæt på pause',reject:'Afvis',review_later:'Gennemgå senere'};const list=document.querySelector('#list');CasaRecommendations.list().then(items=>{if(!items.length){list.innerHTML='<article class="card"><h2>Ingen anbefalinger lige nu</h2><p>Platformen analyserer løbende konfiguration, indhold, assets og gæsteoplevelse.</p></article>';return}list.innerHTML=items.map(x=>`<article class="card"><span class="pill">${x.status}</span><h2>${x.title}</h2><p><strong>Hvorfor:</strong> ${x.reason}</p><p><strong>Hvorfor nu:</strong> ${x.why_now||'Ikke angivet'}</p><div class="grid"><div class="fact"><strong>Forventet gevinst</strong><br>${x.expected_benefit}</div><div class="fact"><strong>Confidence</strong><br>${Math.round(x.confidence*100)}%<br><small>${x.confidence_basis||''}</small></div></div><p class="muted">${x.evidence?.message||''}</p>${x.manual_review_required?`<p><strong>Manuel vurdering kræves:</strong> ${x.manual_review_reason}</p>`:''}<p><strong>Succes betyder:</strong></p><ul>${(x.success_criteria||[]).map(c=>`<li>${c}</li>`).join('')}</ul><div class="actions">${x.actions.map(a=>`<button data-id="${x.id}" data-action="${a}">${labels[a]}</button>`).join('')}</div></article>`).join('')}).catch(err=>{list.innerHTML=`<article class="card error"><h2>Anbefalinger kunne ikke indlæses</h2><p>${err.message}</p></article>`});document.addEventListener('click',async e=>{const b=e.target.closest('button[data-action]');if(!b)return;await CasaRecommendations.decide(b.dataset.id,b.dataset.action);b.closest('.card').querySelector('.pill').textContent=labels[b.dataset.action]||b.dataset.action;});</script></body></html>
