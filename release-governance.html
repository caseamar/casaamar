<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="casa-amar-build" content="2026-07-28T13:25:00+02:00"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Releasekontrol</title><style>body{font-family:system-ui;margin:0;background:#f6f3ed;color:#17372e}.wrap{max-width:1050px;margin:auto;padding:32px}.card{background:white;border:1px solid #ddd4c7;border-radius:18px;padding:20px;margin:14px 0}.row{display:grid;grid-template-columns:minmax(180px,1fr) 2fr;gap:14px;padding:14px 0;border-top:1px solid #eee6dc}.row:first-child{border-top:0}.pass{color:#17633f}.pending{color:#8a5a00}.muted{color:#68756f}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#edf6f1;font-size:.8rem}ul{margin-top:8px}@media(max-width:700px){.row{grid-template-columns:1fr}}</style></head><body><main class="wrap"><a href="/control/">← AI Workspace</a><h1>Releasekontrol</h1><div id="report" class="card">Indlæser selvvurdering…</div><div id="engineering-governance" class="card">Indlæser Engineering Governance…</div><div id="platform-intelligence" class="card">Indlæser Platform Intelligence…</div><div id="learning-registry" class="card">Indlæser Learning Registry…</div><div id="ai-service-layer" class="card">Indlæser AI Service Layer…</div><div id="event-platform" class="card">Indlæser Event Platform…</div><div id="constitution-engine" class="card">Indlæser Platform Constitution…</div></main><script src="/core/casa-release-governance.js?v=20260724.151"></script><script>CasaReleaseGovernance.load().then(r=>{const auto=r.summary;document.querySelector('#report').innerHTML=`<h2>Automatisk releasekontrol: ${auto.automated_confidence}%</h2><p class="pass"><strong>${auto.automated_passed} automatiske områder bestået · ${auto.automated_failed} fejlet</strong></p><p class="pending"><strong>${r.manual_review.length} manuelle kontroller mangler</strong></p><h3>Automatisk verificeret</h3>${r.categories.map(x=>`<div class="row"><div><span class="badge">${x.mode}</span><h4>${x.label}</h4><strong class="pass">PASS</strong></div><div><p><strong>Fordi:</strong> ${x.because}</p><ul>${x.evidence.map(e=>`<li>${e}</li>`).join('')}</ul></div></div>`).join('')}<h3>Kræver menneskelig kontrol</h3>${r.manual_review.map(x=>`<div class="row"><div><span class="badge">manual</span><h4>${x.label}</h4><strong class="pending">AFVENTER</strong></div><div><p><strong>Hvorfor manuelt:</strong> ${x.why_manual}</p><p><strong>Succesadfærd:</strong> ${x.success_criteria}</p><p><strong>Test:</strong> ${x.test_instruction}</p></div></div>`).join('')}<p class="muted"><strong>Status:</strong> ${r.summary.overall_status}. Automatiske fejl blokerer altid releasen; usikre forhold sendes til manuel kontrol.</p>`}).catch(e=>{document.querySelector('#report').innerHTML='<h2>Kunne ikke indlæse releasekontrol</h2><p>'+e.message+'</p>'});</script><script src="/core/casa-engineering-governance.js?v=20260724.151"></script><script>CasaEngineeringGovernance.assess().then(a=>{document.querySelector("#engineering-governance").innerHTML=`<h2>Engineering Governance: ${a.score}/100</h2><p class="${a.status==="pass"?"pass":"pending"}"><strong>${a.status.toUpperCase()}</strong></p><p><strong>Fordi:</strong> ${a.because}</p><div class="row"><div><h4>Kvalitetsdimensioner</h4></div><div><ul>${Object.entries(a.dimensions).map(([k,v])=>`<li>${k}: ${v}/100</li>`).join("")}</ul></div></div><p class="muted">Dependency Graph: ${a.dependencies.nodes} subsystemer · ${a.dependencies.edges} registrerede afhængigheder · Teknisk gæld: ${a.technicalDebt.length}</p>`}).catch(e=>document.querySelector("#engineering-governance").textContent=e.message);</script><script src="/core/casa-platform-intelligence.js?v=20260724.151"></script><script>CasaPlatformIntelligence.assess().then(a=>{const o=a.overall;document.querySelector("#platform-intelligence").innerHTML=`<h2>Platform Intelligence: ${o.score}/100</h2><p class="${o.technical_status==="healthy"?"pass":"pending"}"><strong>Teknisk status: ${o.technical_status==="healthy"?"SUND":"KRÆVER OPMÆRKSOMHED"}</strong></p><p><strong>Hvorfor:</strong> ${o.because}</p><div class="row"><div><h4>Evidens</h4></div><div><ul>${o.evidence.map(e=>`<li>${e}</li>`).join("")}</ul></div></div><p><strong>Næste handling:</strong> <a href="${o.next_action.href}">${o.next_action.label}</a></p>`;document.querySelector("#learning-registry").innerHTML=`<h2 id="learning-registry-title">Learning Registry</h2><p class="pass"><strong>${a.learningSummary.regression_protected} kendte fejlklasser er regressionbeskyttet</strong></p>${a.latestLearnings.map(x=>`<div class="row"><div><span class="badge">${x.type}</span><h4>${x.id}</h4></div><div><strong>${x.title}</strong><p><strong>Læring:</strong> ${x.learning}</p></div></div>`).join("")}`}).catch(e=>{document.querySelector("#platform-intelligence").textContent=e.message;document.querySelector("#learning-registry").textContent=e.message});</script><script src="/core/casa-ai-service.js?v=20260724.151"></script><script>CasaAIService.load().then(x=>{const count=(x.registry.capabilities||[]).length;document.querySelector("#ai-service-layer").innerHTML=`<h2>AI Service Layer: v${CasaAIService.VERSION}</h2><p class="pass"><strong>Provider-neutral foundation er aktiv</strong></p><p>Features anmoder om en kapabilitet frem for en bestemt model eller leverandør.</p><div class="row"><div><h4>Konfiguration</h4></div><div><ul><li>${count} registrerede AI-kapabiliteter</li><li>${x.config.provider_binding==="none"?"Ingen aktiv provider-binding":"Provider konfigureret"}</li><li>Direkte provider-kald: ${x.config.direct_provider_calls_allowed?"tilladt":"forbudt"}</li></ul></div></div><p class="muted">Modelrouting, providers og credentials aktiveres først i senere governance-godkendte releases.</p>`}).catch(e=>document.querySelector("#ai-service-layer").textContent=e.message);</script><script src="/core/casa-events.js?v=20260724.151"></script><script>CasaEvents.loadContracts().then(()=>{const s=CasaEvents.snapshot();const r=CasaEvents.registry;document.querySelector("#event-platform").innerHTML=`<h2>Event Platform: v${s.version}</h2><p class="pass"><strong>Channel-neutral event foundation er aktiv</strong></p><p>Alle fremtidige touchpoints kan dele den samme hændelsesmodel uden at blive bygget som siloer.</p><div class="row"><div><h4>Kontrakter</h4></div><div><ul><li>${s.contract_count} registrerede eventtyper</li><li>Correlation og causation: aktiv</li><li>Idempotency: aktiv</li><li>Privacy classification: aktiv</li><li>Durable storage: planlagt adapter, ikke aktiveret</li></ul></div></div><p class="muted">Event Platform registrerer struktur og governance nu; persondataindsamling og analytics aktiveres først med godkendte policies.</p>`}).catch(e=>document.querySelector("#event-platform").textContent=e.message);</script><script src="/core/casa-constitution.js?v=20260724.151"></script><script>CasaConstitution.assess().then(a=>{document.querySelector("#constitution-engine").innerHTML=`<h2>Platform Constitution: ${a.score}/100</h2><p class="${a.status==="pass"?"pass":"pending"}"><strong>${a.status==="pass"?"ALLE GRUNDREGLER OVERHOLDT":"RELEASE BLOKERET"}</strong></p><p>${a.articles.length} arkitekturartikler · ${a.summary.rules_passed||0}/${a.summary.rules_total||0} eksekverbare integritetsregler bestået.</p><div class="row"><div><h4>Platform Integrity</h4></div><div><ul>${a.rules.map(r=>`<li><strong>${r.label}:</strong> ${r.status.toUpperCase()} — ${r.because}</li>`).join("")}</ul></div></div><p class="muted">Arkitekturbudget: ${a.budget.status||"ukendt"} · Kompleksitetsændring: ${a.budget.complexity_delta_percent||0}% · Nye afhængigheder: ${a.budget.dependency_delta||0}</p>`}).catch(e=>document.querySelector("#constitution-engine").textContent=e.message);</script><script src="/core/casa-workspace-state.js?v=20260724.151"></script></body></html>
