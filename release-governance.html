<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="casa-amar-build" content="2026-07-28T08:46:07+02:00"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Release Governance</title><style>body{font-family:system-ui;margin:0;background:#f6f3ed;color:#17372e}.wrap{max-width:1050px;margin:auto;padding:32px}.card{background:white;border:1px solid #ddd4c7;border-radius:18px;padding:20px;margin:14px 0}.row{display:grid;grid-template-columns:minmax(180px,1fr) 2fr;gap:14px;padding:14px 0;border-top:1px solid #eee6dc}.row:first-child{border-top:0}.pass{color:#17633f}.pending{color:#8a5a00}.muted{color:#68756f}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#edf6f1;font-size:.8rem}ul{margin-top:8px}@media(max-width:700px){.row{grid-template-columns:1fr}}</style></head><body><main class="wrap"><a href="/control/#ai-workspace">← AI Workspace</a><h1>Release Governance</h1><div id="report" class="card">Indlæser selvvurdering…</div></main><script src="/core/casa-release-governance.js?v=20260724.135"></script><script>CasaReleaseGovernance.load().then(r=>{const auto=r.summary;document.querySelector('#report').innerHTML=`<h2>Automatisk releasekontrol: ${auto.automated_confidence}%</h2><p class="pass"><strong>${auto.automated_passed} automatiske områder bestået · ${auto.automated_failed} fejlet</strong></p><p class="pending"><strong>${r.manual_review.length} manuelle kontroller mangler</strong></p><h3>Automatisk verificeret</h3>${r.categories.map(x=>`<div class="row"><div><span class="badge">${x.mode}</span><h4>${x.label}</h4><strong class="pass">PASS</strong></div><div><p><strong>Fordi:</strong> ${x.because}</p><ul>${x.evidence.map(e=>`<li>${e}</li>`).join('')}</ul></div></div>`).join('')}<h3>Kræver menneskelig kontrol</h3>${r.manual_review.map(x=>`<div class="row"><div><span class="badge">manual</span><h4>${x.label}</h4><strong class="pending">AFVENTER</strong></div><div><p><strong>Hvorfor manuelt:</strong> ${x.why_manual}</p><p><strong>Succesadfærd:</strong> ${x.success_criteria}</p><p><strong>Test:</strong> ${x.test_instruction}</p></div></div>`).join('')}<p class="muted"><strong>Status:</strong> ${r.summary.overall_status}. Automatiske fejl blokerer altid releasen; usikre forhold sendes til manuel kontrol.</p>`}).catch(e=>{document.querySelector('#report').innerHTML='<h2>Kunne ikke indlæse releasekontrol</h2><p>'+e.message+'</p>'});</script></body></html>
