<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guidet forbedring · Casa Amar</title><link rel="stylesheet" href="/styles.css"><style>
:root{--ink:#17372e;--muted:#68756f;--line:#e4ddd2;--bg:#f5f1ea;--accent:#c95f3d;--good:#17633f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:900px;margin:auto;padding:28px 20px}.panel{background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px;margin:14px 0}.eyebrow{color:var(--muted);font-size:.82rem}.progress{height:9px;background:#e9e1d7;border-radius:99px;overflow:hidden;margin:12px 0}.progress i{display:block;height:100%;background:var(--accent)}h1{font-size:clamp(2rem,5vw,3.6rem);line-height:1.05}.preview{display:grid;grid-template-columns:1fr 1fr;gap:12px}.preview section{border:1px solid var(--line);border-radius:15px;padding:16px;background:#faf8f4}.buttons{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 15px;font-weight:800;cursor:pointer}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.danger{color:#9a2f21}.receipt{background:#eaf5ef;border-radius:14px;padding:15px;margin-top:14px}.why{background:#fff3d9;border-radius:14px;padding:14px}.hidden{display:none}@media(max-width:650px){.preview{grid-template-columns:1fr}}</style></head><body><main class="wrap"><a href="/domain-intelligence.html#impact">← Tilbage til forbedringer</a><section class="panel"><div class="eyebrow" id="step">Guidet forbedring</div><div class="progress"><i id="bar"></i></div><h1 id="title">Indlæser opgaven…</h1><p id="description"></p><div class="why"><strong>Hvorfor er dette relevant?</strong><p id="why"></p></div></section><section class="panel"><h2>Gennemgå forslaget</h2><div class="preview"><section><h3>Nuværende</h3><p id="before"></p></section><section><h3>AI foreslår</h3><p id="after"></p></section></div><p class="eyebrow">Intet udgives automatisk. Godkendelsen gemmes som en workspace-kladdde.</p><div class="buttons"><button class="button primary" id="approve">Godkend og fortsæt</button><button class="button" id="edit">Redigér først</button><button class="button" id="later">Gør senere</button><button class="button danger" id="reject">Ikke relevant</button></div><div id="receipt" class="receipt hidden"></div></section></main><script src="/core/casa-action-language.js?v=20260724.184"></script><script src="/core/casa-action-orchestrator.js?v=20260724.184"></script><script>
const q=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const p=new URLSearchParams(location.search),id=p.get('action'),returnTo=p.get('returnTo')||'/domain-intelligence.html#impact';let action;
const templates={
 'asset-intelligence':a=>({before:'Billedets nuværende beskrivelse er enten mangelfuld eller bruger ikke den verificerede viden om patioen.',after:'Patioen ved Casa Amar med to solsenge med kraftige hynder, et stort terrassebord, grill og blomstrende bougainvillea.',why:'En præcis billedbeskrivelse forbedrer tilgængelighed, søgbarhed og AI-forståelse.'}),
 'content-intelligence':a=>({before:'Den nuværende tekst beskriver patioen generelt uden den nye verificerede viden.',after:a.key==='content:experience'?'Den private patio indbyder til afslapning og udendørs måltider med solsenge, stort terrassebord, grill og blomstrende bougainvillea.':'Casa Amar har en privat patio med komfortable solsenge, spiseplads og grill til afslappede måltider udendørs.',why:'Mere konkret information hjælper gæsterne med at forstå oplevelsen og reducerer usikkerhed.'}),
 'digital-concierge':a=>({before:'Den digitale guide har ikke et præcist svar om grillen på patioen.',after:'Grillen står på den private patio ved det store terrassebord. Den kan bruges til madlavning udendørs under opholdet.',why:'Gæster får et direkte og ensartet svar uden at skulle kontakte værten.'})};
function saveDraft(a,text){const key='casa.guided-work-drafts.v1',data=JSON.parse(localStorage.getItem(key)||'[]');data.push({actionId:a.id,target:a.originalWorkspace||a.targetWorkspace,text,createdAt:new Date().toISOString(),status:'approved_draft'});localStorage.setItem(key,JSON.stringify(data));localStorage.setItem('casa.publish-required','true')}
function finish(outcome,message){CasaActionOrchestrator.complete(action.id,{outcome,message,completedAt:new Date().toISOString()});localStorage.setItem('casa.action-completion',JSON.stringify({actionId:action.id,outcome,message,completedAt:new Date().toISOString()}));receipt.classList.remove('hidden');receipt.innerHTML=`<strong>${esc(message)}</strong><p>Platformen går videre til næste forbedring, hvis du har startet et guidet flow.</p>`;setTimeout(()=>location.href=returnTo,700)}
CasaActionOrchestrator.load().then(()=>{action=CasaActionOrchestrator.get(id);if(!action)throw new Error('Opgaven findes ikke');const u=CasaActionLanguage.explain(action),t=(templates[action.originalWorkspace]||templates['content-intelligence'])(action),bp=CasaActionOrchestrator.batchProgress();step.textContent=bp?`Forbedring ${bp.completed+1} af ${bp.total}`:'En konkret forbedring';bar.style.width=`${bp?Math.round(bp.completed/bp.total*100):10}%`;title.textContent=u.title;description.textContent=u.description;why.textContent=u.outcome;before.textContent=t.before;after.textContent=t.after;approve.onclick=()=>{saveDraft(action,t.after);finish('approved',`${u.title} er godkendt og gemt som kladde.`)};edit.onclick=()=>{after.contentEditable='true';after.focus();edit.textContent='Gem redigering';edit.onclick=()=>{saveDraft(action,after.textContent);finish('edited',`${u.title} er redigeret og gemt som kladde.`)}};later.onclick=()=>{CasaActionOrchestrator.defer(action.id);location.href=returnTo};reject.onclick=()=>{CasaActionOrchestrator.reject(action.id,'Ikke relevant');location.href=returnTo}}).catch(e=>{title.textContent='Opgaven kunne ikke åbnes';description.textContent=e.message;approve.disabled=true});
</script></body></html>
