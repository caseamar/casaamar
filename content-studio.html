<!doctype html>
<html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta content="2026-07-28T12:45:00+02:00" name="casa-amar-build"><title>Content Studio · Casa Amar</title>
<link rel="stylesheet" href="/platform-ui.css?v=20260724.149">
<style>
body{background:#f5f1ea;color:#17372e}.wrap{max-width:1180px;margin:auto;padding:28px 20px 60px}.top{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:24px}.top a,.btn{text-decoration:none;border:1px solid #d9cfc2;border-radius:999px;padding:10px 14px;color:#17372e;background:#fff;font-weight:700}h1{font-size:clamp(2rem,5vw,4rem);margin:.2em 0}.lede{max-width:760px;color:#68756f}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:24px 0}.metric,.card{background:#fff;border:1px solid #e4ddd2;border-radius:18px;padding:18px}.metric span,.muted{color:#68756f;font-size:.82rem}.metric strong{display:block;font-size:1.6rem;margin-top:6px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}select,input{padding:11px 13px;border:1px solid #d9cfc2;border-radius:12px;background:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:14px}.card{cursor:pointer;text-align:left;color:inherit}.card:hover,.card:focus-visible{outline:2px solid #c96d4d;outline-offset:2px;box-shadow:0 12px 30px rgba(20,65,52,.09)}.row{display:flex;justify-content:space-between;gap:12px}.pill{font-size:.72rem;padding:5px 8px;border-radius:999px;background:#edf6f1}.pill.review{background:#fff5df}.pill.blocked{background:#f9e5e0}.issues{margin:12px 0 0;padding-left:18px;color:#6c4d43}dialog{border:0;border-radius:22px;max-width:680px;width:calc(100% - 32px);padding:0;box-shadow:0 30px 80px rgba(0,0,0,.25)}dialog::backdrop{background:rgba(18,33,29,.55)}.dialog{padding:24px}.close{float:right;border:0;background:#eee6dc;border-radius:50%;width:38px;height:38px;cursor:pointer}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.empty{padding:40px;text-align:center;background:#fff;border-radius:18px}
</style></head><body><main class="wrap">
<div class="top"><a href="/control/">← AI Workspace</a><a href="/page-studio.html">Åbn Page Studio</a></div>
<div class="muted">AI Workspace · Content Studio · v1.1.0</div><h1>Content Studio</h1><p class="lede">Administrér sider, se deres sundhed og find de vigtigste forbedringer. Data kommer fra det centrale sideregister.</p>
<section class="summary" id="summary"><div class="metric"><span>Status</span><strong>Indlæser…</strong></div></section><section id="operations" class="card" tabindex="-1" style="margin:18px 0"><div class="row"><div><div class="muted">Content Operations · v1.0.0</div><h2>Arbejdskøer</h2></div><button class="btn" id="refreshOps" type="button">Opdatér</button></div><div class="summary" id="opsSummary"><div class="metric"><span>Status</span><strong>Indlæser…</strong></div></div><div class="toolbar"><button class="btn" data-queue="content">Indholdskø</button><button class="btn" data-queue="review">Reviewkø</button><button class="btn" data-queue="publish">Publiceringskø</button></div><div id="queueList" class="grid"></div></section>
<div class="toolbar"><input id="search" type="search" placeholder="Søg efter side"><select id="status"><option value="">Alle statusser</option><option>published</option><option>ready</option><option>review</option><option>draft</option></select><select id="language"><option value="">Alle sprog</option><option value="da">Dansk</option><option value="en">English</option><option value="es">Español</option></select></div>
<section class="grid" id="pages"><div class="empty">Indlæser sider…</div></section>
</main><dialog id="details"><div class="dialog"><button class="close" aria-label="Luk">×</button><div id="detailBody"></div></div></dialog>
<script src="/core/casa-core.js?v=20260724.149"></script><script src="/core/casa-events.js?v=20260724.149"></script><script src="/core/casa-content-studio.js?v=20260724.149"></script><script src="/core/casa-content-operations.js?v=20260724.149"></script>
<script>
const q=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));let all=[];
function render(){const term=q('#search').value.toLowerCase(),status=q('#status').value,lang=q('#language').value;const rows=all.filter(x=>(!term||(x.display_name+x.route).toLowerCase().includes(term))&&(!status||x.status===status)&&(!lang||x.languages.includes(lang)));q('#pages').innerHTML=rows.length?rows.map(x=>`<button class="card" data-id="${x.id}"><div class="row"><strong>${esc(x.display_name)}</strong><span class="pill ${x.health.level}">${x.health.score}%</span></div><div class="muted">${esc(x.route)} · ${esc(x.status)} · ${x.languages.map(s=>s.toUpperCase()).join(', ')}</div>${x.health.issues.length?`<ul class="issues">${x.health.issues.slice(0,3).map(i=>`<li>${esc(i.label)}</li>`).join('')}</ul>`:'<p class="muted">Ingen kendte problemer</p>'}</button>`).join(''):'<div class="empty">Ingen sider matcher filteret.</div>';}
function openPage(id){const x=window.CasaContentStudio.get(id);if(!x)return;q('#detailBody').innerHTML=`<div class="muted">${esc(x.route)} · ${esc(x.status)}</div><h2>${esc(x.display_name)}</h2><p><strong>Side Health:</strong> ${x.health.score}% · ${esc(x.health.level)}</p><p><strong>Sprog:</strong> ${x.languages.map(s=>s.toUpperCase()).join(', ')}</p><p><strong>Sektioner:</strong> ${x.sections} · <strong>FAQ:</strong> ${x.faq_count}</p><h3>AI Suggestions</h3>${x.health.issues.length?`<ul>${x.health.issues.map(i=>`<li>${esc(i.label)} <span class="muted">(${i.severity})</span></li>`).join('')}</ul>`:'<p>Ingen forslag lige nu. Siden opfylder de aktuelle kvalitetsregler.</p>'}<div class="actions"><a class="btn" href="/page-studio.html?page=${encodeURIComponent(x.id)}">Redigér side</a><a class="btn" href="/asset-intelligence.html">Se assets</a></div>`;q('#details').showModal();}

let currentQueue="content";
function renderQueue(name=currentQueue){currentQueue=name;const rows=window.CasaContentOperations.queue(name);q('#queueList').innerHTML=rows.length?rows.slice(0,18).map(x=>`<article class="card"><div class="row"><strong>${esc(x.title)}</strong><span class="pill ${x.status==='blocked'?'blocked':x.status==='ready'?'':'review'}">${esc(x.status)}</span></div><p class="muted">${esc(x.page_id)}${x.priority?' · '+esc(x.priority):''}</p>${x.blockers?.length?`<ul class="issues">${x.blockers.map(b=>`<li>${esc(b)}</li>`).join('')}</ul>`:''}${x.impact?.length?`<p class="muted"><strong>Påvirker:</strong> ${x.impact.map(esc).join(', ')}</p>`:''}<div class="actions"><a class="btn" href="${esc(x.action_href)}">${esc(x.action_label)}</a></div></article>`).join(''):'<div class="empty">Ingen opgaver i denne kø.</div>';}
async function initOperations(){await window.CasaContentOperations.load();const x=window.CasaContentOperations.snapshot();q('#opsSummary').innerHTML=`<div class="metric"><span>Indholdsopgaver</span><strong>${x.content_count}</strong></div><div class="metric"><span>Kræver review</span><strong>${x.review_count}</strong></div><div class="metric"><span>Klar til publicering</span><strong>${x.publish_ready}</strong></div><div class="metric"><span>Blokeret</span><strong>${x.publish_blocked}</strong></div>`;renderQueue();}
document.addEventListener('click',e=>{const b=e.target.closest('[data-queue]');if(b)renderQueue(b.dataset.queue)});q('#refreshOps').onclick=()=>initOperations();

async function init(){await Promise.all([window.CasaContentStudio.load(),window.CasaContentOperations.load()]);all=window.CasaContentStudio.list();const s=window.CasaContentStudio.snapshot();q('#summary').innerHTML=`<div class="metric"><span>Sider</span><strong>${s.page_count}</strong></div><div class="metric"><span>Klar</span><strong>${s.ready_count}</strong></div><div class="metric"><span>Kræver review</span><strong>${s.review_count}</strong></div><div class="metric"><span>Blokeret</span><strong>${s.blocked_count}</strong></div><div class="metric"><span>Forbedringer</span><strong>${s.issue_count}</strong></div>`;render();await initOperations();}
q('#pages').addEventListener('click',e=>{const card=e.target.closest('[data-id]');if(card)openPage(card.dataset.id)});['search','status','language'].forEach(id=>q('#'+id).addEventListener('input',render));q('.close').onclick=()=>q('#details').close();if(location.hash==="#operations")setTimeout(()=>q("#operations")?.scrollIntoView({behavior:"smooth",block:"start"}),350);init().catch(e=>q('#pages').innerHTML=`<div class="empty">${esc(e.message)}</div>`);
</script><script src="/core/casa-workspace-state.js?v=20260724.149"></script></body></html>
