<!doctype html><html lang='da'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Platform Lifecycle · Casa Amar</title><link rel='stylesheet' href='/platform-ui.css'><style>main{max-width:1100px;margin:40px auto;padding:20px}.chain,.stages{display:grid;gap:10px}.chain{grid-template-columns:repeat(9,1fr)}.stages{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.node{border:1px solid #ddd;border-radius:14px;padding:14px;background:white}.node.active{outline:3px solid #d8b35b}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}@media(max-width:800px){.chain{grid-template-columns:1fr 1fr}}</style></head><body><main><p><a href='/control/'>← Mission Control</a></p><h1>Platformens livscyklus</h1><p>Blueprintets værdikæde og aktive arbejdsrejse. Dette er en funktionel administrationsvisning — ikke det endelige UI.</p><h2>Værdikæde</h2><div class='chain' id='chain'></div><h2>Aktiv rejse</h2><div id='summary'></div><div class='stages' id='stages'></div><div class='actions'><button id='implementation'>Start implementeringsrejse</button><button id='improvement'>Start forbedringsloop</button><button id='complete'>Markér trin gennemført</button><a id='next' href='/control/'>Åbn næste handling</a></div></main><script src='/core/casa-events.js?v=20260724.320'></script><script src='/core/casa-platform-orchestrator.js?v=20260724.320'></script><script>async function render(){await CasaPlatformOrchestrator.load();const s=CasaPlatformOrchestrator.snapshot();chain.innerHTML=s.valueChain.map(x=>`<div class='node'>${x}</div>`).join('');summary.innerHTML=`<p><strong>${s.journey.display_name}</strong><br>${s.journey.purpose}</p>`;stages.innerHTML=s.journey.stages.map(x=>`<div class='node ${x.id===s.stage.id?'active':''}'><strong>${x.display_name}</strong><p>${x.outcome}</p><small>${x.capabilities.join(' · ')}</small></div>`).join('');next.href=s.nextAction.href;next.textContent=`Åbn næste handling: ${s.nextAction.title}`};implementation.onclick=()=>{CasaPlatformOrchestrator.start('implementation','demo');render()};improvement.onclick=()=>{CasaPlatformOrchestrator.start('continuous-improvement','observe');render()};complete.onclick=()=>{CasaPlatformOrchestrator.completeStage('Manuelt accepteret i lifecycle-visningen');render()};render();</script></body></html>
