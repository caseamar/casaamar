</style></head><body><header><div class="brand">Casa Amar AI</div><nav><a href="/control/">← AI Workspace</a></nav></header><main class="wrap"><section class="hero"><div class="kicker">AI Workspace · Knowledge</div><h1>AI Knowledge Graph</h1><p>Udforsk platformens viden, relationer og manglende forbindelser i et brugerorienteret overblik.</p></section><div id="app"><div class="panel">Indlæser…</div></div></main><script>
fetch('/registry/knowledge-graph.json',{cache:'no-store'}).then(r=>r.json()).then(g=>{const entities=g.entities||[],relations=g.relations||[];const byType={};entities.forEach(x=>byType[x.type]=(byType[x.type]||0)+1);const linked=new Set(relations.flatMap(x=>[x.from,x.to]));const orphans=entities.filter(x=>!linked.has(x.id));document.querySelector('#app').innerHTML=`<div class="grid"><div class="card"><span>Entities</span><strong>${entities.length}</strong></div><div class="card"><span>Relationer</span><strong>${relations.length}</strong></div><div class="card"><span>Entity-typer</span><strong>${Object.keys(byType).length}</strong></div><div class="card"><span>Uden relation</span><strong>${orphans.length}</strong></div></div><section class="panel"><h2>Viden i grafen</h2><div class="list">${Object.entries(byType).sort((a,b)=>b[1]-a[1]).map(([type,n])=>`<div class="row"><div><strong>${type}</strong><small>Registrerede videnselementer</small></div><span class="badge ok">${n}</span></div>`).join('')}</div><div class="actions"><a class="button" href="/knowledge-studio.html">Åbn Knowledge Studio</a><a class="button secondary" href="/control/#platform-intelligence">Tekniske detaljer</a></div></section>`}).catch(e=>document.querySelector('#app').innerHTML=`<div class="panel error">${e.message}</div>`);
</script><script src="/core/casa-workspace-state.js?v=20260724.161"></script></body></html>
